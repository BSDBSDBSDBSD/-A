plugins {
    id 'com.android.application'
}

android {
    namespace 'com.missedcalls.screen'
    compileSdk 34

    defaultConfig {
        applicationId 'com.missedcalls.screen'
        minSdk 17
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // חתימה במפתח debug כדי שה-APK יהיה ניתן להתקנה ישירה
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // בדיקה שאין שימוש ב-API שלא קיים בגרסאות ישנות
        checkOnly 'NewApi', 'InlinedApi'
        error 'NewApi'
        abortOnError true
        checkReleaseBuilds false
    }
}

// ללא תלויות חיצוניות - רק ה-SDK של אנדרואיד, כדי שהאפליקציה תהיה קטנה וקלה למכשירי מקשים
