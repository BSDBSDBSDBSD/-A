plugins {
    id 'com.android.application'
}

android {
    namespace 'com.missedcalls.screen'
    compileSdk 34

    defaultConfig {
        applicationId 'com.missedcalls.screen'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // חתימה במפתח debug כדי שה-APK יהיה ניתן להתקנה ישירה
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// ללא תלויות חיצוניות - רק ה-SDK של אנדרואיד, כדי שהאפליקציה תהיה קטנה וקלה למכשירי מקשים
